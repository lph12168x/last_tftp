<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0088aa"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Two rounded rectangles (server left, client right) -->
  <rect x="120" y="176" width="120" height="160" rx="16" fill="#0f3460"/>
  <rect x="272" y="176" width="120" height="160" rx="16" fill="#0f3460"/>
  
  <!-- Transfer arrow (center) -->
  <path d="M248 256 L264 256" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 248 L272 256 L256 264" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Small status dots on each box -->
  <circle cx="180" cy="216" r="6" fill="#00d4ff"/>
  <circle cx="332" cy="216" r="6" fill="#00d4ff"/>
</svg>
