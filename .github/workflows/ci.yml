name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: last-tftp-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: last-tftp-windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: last-tftp-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./crates/last-tftp-core -> target
          cache-on-failure: true
          key: v6

      - name: Build
        shell: bash
        run: |
          # 强制重建 last-tftp-app（避免 rust-cache 跳过 build.rs）
          cargo clean -p last-tftp-app 2>/dev/null || true
          cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --target ${{ matrix.target }} --no-fail-fast

      - name: Strip dep file
        shell: bash
        run: |
          find "target/${{ matrix.target }}/release" -maxdepth 1 -name '*.d' -delete 2>/dev/null || true
          find "target/${{ matrix.target }}/release" -maxdepth 1 -name '*.pdb' -delete 2>/dev/null || true

      - name: Inject icon on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          .\rcedit.exe "target\x86_64-pc-windows-msvc\release\last-tftp.exe" --set-icon "resources\icons\icon.ico"
          Write-Host "Icon injected successfully"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/last-tftp*
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/last-tftp*
          fail_on_unmatched_files: false
